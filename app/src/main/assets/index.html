<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#101010">
<title>Solune · Paper &amp; Marble</title>
<style>
:root{
  --bg:#111110;
  --panel:#1a1a19;
  --panel-2:#20201f;
  --hover:#282725;
  --line:#31302e;
  --text:#f2efe8;
  --muted:#a7a198;
  --accent:#d97757;
  --accent-2:#ed987a;
  --user:#2a2927;
  --shadow:0 18px 60px rgba(0,0,0,.34);
  --radius:26px;
  --composer-h:170px;
  --tab-index:0;
  --spring:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
html.theme-light,body.theme-light{
  --bg:#f8f6f1;
  --panel:#ffffff;
  --panel-2:#f3efe8;
  --hover:#ebe5db;
  --line:#ddd6ca;
  --text:#26231f;
  --muted:#7a7368;
  --accent:#d97757;
  --accent-2:#e18a69;
  --user:#f1ece3;
  --shadow:0 18px 45px rgba(66,53,36,.09);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:16px/1.5 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body.reduced *{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
a{color:inherit}
.hidden{display:none!important}
#app{height:100dvh;display:flex;position:relative;isolation:isolate;background:radial-gradient(circle at 50% -5%, rgba(217,119,87,.08), transparent 28%), var(--bg)}
main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.iconbtn,.round,.tabbtn,.chip,.actionbtn,.option,.history-item,.menu-item,.card-btn,.seg-btn,.list-btn,.theme-card,.tile-btn{
  transition:transform .28s var(--spring), background-color .22s ease, border-color .22s ease, opacity .22s ease, box-shadow .28s var(--spring), color .22s ease;
}
.iconbtn:active,.round:active,.tabbtn:active,.chip:active,.actionbtn:active,.option:active,.history-item:active,.menu-item:active,.card-btn:active,.seg-btn:active,.list-btn:active,.theme-card:active,.tile-btn:active{transform:scale(.97)}
.iconbtn,.round{display:inline-flex;align-items:center;justify-content:center;border-radius:18px}
.iconbtn{width:42px;height:42px;color:var(--muted)}
.iconbtn:hover,.round:hover{background:var(--hover);color:var(--text)}
.round{width:44px;height:44px;background:var(--hover);color:var(--muted)}
svg.ico{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
header.topbar{padding:10px 14px 0;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:60px;position:relative;z-index:2}
.brand-stack{display:flex;align-items:center;gap:10px;min-width:0;max-width:60vw;margin:auto}
.brand-mark{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--accent);position:relative;overflow:hidden;flex:none}
.brand-mark:before{content:"";position:absolute;inset:5px;border-radius:9px;background:radial-gradient(circle at 35% 35%, color-mix(in oklab, var(--accent) 86%, white 14%), var(--accent));opacity:.14;transform:scale(1);transition:transform .4s var(--spring),opacity .3s}
.brand-mark:hover:before{transform:scale(1.08);opacity:.18}
.brand-mark svg{width:100%;height:100%}
.brand-meta{min-width:0;text-align:center}
.brand-title{font:600 14px/1.2 Inter,system-ui;margin:0;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{padding:0 16px 10px;display:grid;place-items:center;min-height:calc(100dvh - var(--composer-h) - 84px)}
.hero-inner{width:min(620px,100%);text-align:center;display:grid;justify-items:center;gap:10px;animation:fadeUp .7s var(--spring)}
.hero .logo-big{width:66px;height:66px;display:grid;place-items:center;color:var(--accent);border-radius:22px;position:relative}
.hero .logo-big:before{content:"";position:absolute;inset:0;border-radius:24px;background:radial-gradient(circle at 35% 35%, rgba(217,119,87,.22), transparent 65%);filter:blur(8px)}
.hero .logo-big svg{width:100%;height:100%;position:relative}
.hero-title{font:400 clamp(32px,5.5vw,46px)/1.1 Georgia,serif;letter-spacing:-1.2px;margin:0}
.hero-sub{font-size:13px;color:var(--muted)}
.hero-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:12px}
.chip b{font-weight:600;color:var(--text)}
.hero-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:10px}
.card-btn{padding:11px 16px;border-radius:18px;background:var(--panel);border:1px solid var(--line);display:inline-flex;align-items:center;gap:10px;color:var(--text);box-shadow:var(--shadow)}
.card-btn.primary{background:linear-gradient(180deg, color-mix(in oklab, var(--panel) 30%, var(--accent) 70%), color-mix(in oklab, var(--panel) 55%, var(--accent) 45%));border-color:transparent;color:#fff;box-shadow:0 18px 45px color-mix(in oklab, var(--accent) 20%, transparent)}
.card-btn small{display:block;color:inherit;opacity:.72}
.feed{flex:1;min-height:0;overflow:auto;padding:0 max(16px, calc((100% - 780px)/2)) 22px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.feed.with-messages{padding-top:8px}
.thread{display:grid;gap:18px;padding-top:6px}
.msg{animation:fadeUp .35s var(--spring)}
.user-wrap{display:grid;justify-items:end;gap:6px}
.user-bubble{max-width:min(88%,680px);background:var(--user);border:1px solid color-mix(in oklab, var(--line) 55%, transparent);padding:14px 16px;border-radius:24px 24px 8px 24px;box-shadow:var(--shadow);white-space:pre-wrap;overflow-wrap:anywhere}
.assistant{display:grid;gap:10px}
.assist-head{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;font-weight:600}
.assist-head .brand-mark{width:22px;height:22px;border-radius:8px}
.assist-body{font-size:16px;line-height:1.74;overflow-wrap:anywhere}
.assist-body p{margin:0 0 12px;white-space:pre-wrap}
.assist-body ul,.assist-body ol{margin:8px 0 14px;padding-left:22px}
.assist-body h2,.assist-body h3{margin:16px 0 8px;line-height:1.25}
.assist-body blockquote{margin:10px 0;padding:10px 14px;border-left:2px solid var(--line);background:var(--panel);border-radius:0 12px 12px 0;color:var(--muted)}
.assist-body code:not(pre code){background:var(--hover);padding:2px 5px;border-radius:6px;font:0.9em ui-monospace,SFMono-Regular,Consolas,monospace}
.status-row{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.thinking{display:inline-flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow)}
.thinking .spinner{width:18px;height:18px;color:var(--accent);animation:spin 1.9s linear infinite}
.thinking.done{background:transparent;border-color:transparent;box-shadow:none;padding:0}
.thinking.done .spinner{animation:none;color:var(--muted)}
.dots::after{content:"";animation:dots 1.6s infinite}
.msg-actions{display:flex;align-items:center;gap:4px;color:var(--muted)}
.actionbtn{width:34px;height:34px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:inherit}
.actionbtn:hover{background:var(--hover);color:var(--text)}
.meta-time{font-size:11px;color:var(--muted)}
.code-card{border:1px solid var(--line);border-radius:18px;background:var(--panel);overflow:hidden;margin:12px 0 16px;box-shadow:var(--shadow)}
.code-top{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;font-size:12px;color:var(--muted);gap:10px}
.code-tools{display:flex;align-items:center;gap:4px}
.code-tools .actionbtn{width:30px;height:30px;border-radius:10px}
pre{margin:0;padding:16px;background:#0f0f10;color:#e6e2db;overflow:auto;tab-size:2;max-height:420px;font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
body.theme-light pre{background:#161616}
.tag{color:#89b6e2}.kw{color:#d9a2f1}.str{color:#a9cd91}.num{color:#edb48e}.comment{color:#8b8c90}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow);margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}tr:last-child td{border-bottom:0}th{color:var(--text);font-weight:600;background:color-mix(in oklab,var(--panel),var(--hover) 65%)}
.image-card{border:1px solid var(--line);border-radius:22px;background:var(--panel);overflow:hidden;box-shadow:var(--shadow);width:min(100%,560px);margin:10px 0 16px}
.image-frame{position:relative;background:linear-gradient(180deg,#191918,#101010)}
.image-frame img{display:block;width:100%;height:auto;min-height:180px;object-fit:contain}
.image-frame .gen-overlay{position:absolute;inset:auto 12px 12px auto;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:8px 10px;font-size:11px;color:#fff;display:flex;align-items:center;gap:7px}
.image-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;color:var(--muted);font-size:12px;gap:10px}
.image-actions{display:flex;gap:4px}
.svg-placeholder{display:flex;align-items:center;gap:10px;color:var(--muted);padding:14px 16px;border:1px dashed var(--line);border-radius:18px;background:var(--panel)}
.preview-modal,.overlay,.drawer-scrim,.panel-scrim{position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:40}
.drawer-scrim,.panel-scrim,.preview-modal,.overlay{background:rgba(0,0,0,.45);backdrop-filter:blur(6px)}
.drawer{position:absolute;z-index:50;top:0;bottom:0;left:0;width:min(350px,88vw);background:color-mix(in oklab, var(--panel) 92%, black 8%);border-right:1px solid var(--line);padding:18px 14px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;transform:translateX(-103%);transition:transform .42s var(--spring);box-shadow:var(--shadow)}
.drawer.open{transform:translateX(0)}
.drawer-scrim.open,.panel-scrim.open,.overlay.open,.preview-modal.open{opacity:1;pointer-events:auto}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 4px 0}
.drawer-brand{display:flex;align-items:center;gap:10px}
.drawer-brand .word{font:400 22px/1.1 Georgia,serif;letter-spacing:-.8px}
.search{display:flex;align-items:center;gap:8px;background:var(--hover);border:1px solid transparent;border-radius:16px;padding:0 12px;height:44px}
.search:focus-within{border-color:var(--line)}
.search input{width:100%;background:transparent;border:0;outline:none}
.new-chat{border-radius:18px;background:var(--panel-2);border:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.section-label{padding:2px 6px 0;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.history{flex:1;min-height:0;overflow:auto;display:grid;gap:4px;padding-right:2px}
.history-item{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:10px 10px 10px 12px;border-radius:16px;color:var(--text);background:transparent}
.history-item:hover{background:var(--hover)}
.history-item.active{background:var(--hover);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--line),transparent 40%)}
.history-main{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.history-title{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.history-sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.history-item .actionbtn{width:30px;height:30px}
.drawer-foot{display:grid;gap:4px;padding-top:6px}
.menu-item{display:flex;align-items:center;gap:10px;padding:12px 12px;border-radius:16px;color:var(--text)}
.menu-item:hover{background:var(--hover)}
.menu-item small{display:block;color:var(--muted)}
.bottom-nav-wrap{padding:10px 16px max(10px,env(safe-area-inset-bottom));display:none;justify-content:center;background:linear-gradient(180deg,transparent,var(--bg) 35%)}
.bottom-nav{width:min(520px,100%);background:color-mix(in oklab,var(--panel) 95%,black 5%);border:1px solid var(--line);border-radius:28px;padding:5px;display:grid;grid-template-columns:repeat(4,1fr);position:relative;box-shadow:var(--shadow)}
.tab-indicator{position:absolute;top:5px;left:5px;bottom:5px;width:calc((100% - 10px)/4);background:linear-gradient(180deg,color-mix(in oklab,var(--hover),var(--panel) 15%),color-mix(in oklab,var(--hover),var(--panel) 35%));border:1px solid color-mix(in oklab,var(--line),transparent 30%);border-radius:22px;transform:translateX(calc(var(--tab-index) * 100%));transition:transform .42s var(--spring), background .25s ease}
.tabbtn{position:relative;z-index:1;min-height:72px;border-radius:22px;display:grid;place-items:center;gap:4px;padding:10px 6px;color:var(--muted)}
.tabbtn.active{color:var(--text)}
.tabbtn span{font-size:12px}
.composer-wrap{padding:8px max(14px,calc((100% - 780px)/2)) 0;background:linear-gradient(180deg,transparent,var(--bg) 30%);position:relative;z-index:3}
.composer{background:color-mix(in oklab, var(--panel) 95%, black 5%);border:1px solid var(--line);border-radius:30px;padding:10px 12px 12px;box-shadow:var(--shadow);transition:border-color .25s ease, box-shadow .3s var(--spring), transform .3s var(--spring)}
.composer:focus-within{border-color:color-mix(in oklab,var(--accent),var(--line) 45%);box-shadow:0 18px 55px rgba(0,0,0,.25);transform:translateY(-1px)}
.mode-row{display:flex;align-items:center;gap:8px;min-height:22px;padding:2px 4px 6px 6px}
.mode-pill{display:none;align-items:center;gap:8px;padding:7px 11px;border-radius:999px;background:rgba(217,119,87,.12);color:var(--accent);font-size:12px}
.mode-pill.show{display:inline-flex}
.mode-pill .actionbtn{width:22px;height:22px;border-radius:999px}
.input-row{display:flex;align-items:flex-end;gap:10px}
#prompt{width:100%;min-height:44px;max-height:180px;resize:none;border:0;outline:none;background:transparent;padding:10px 2px 8px;font-size:16px;line-height:1.45}
#prompt::placeholder{color:var(--muted)}
.composer-toolbar{display:flex;align-items:center;gap:8px;min-width:0;margin-top:6px}
.tool-chip{display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border-radius:999px;background:var(--hover);font-size:12px;color:var(--text)}
.tool-chip span{color:var(--muted)}
.send-btn{width:46px;height:46px;border-radius:50%;background:var(--text);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 12px 32px rgba(0,0,0,.18)}
.send-btn:hover{background:var(--accent);color:#fff}
.send-btn:disabled{opacity:.36}
.note{font-size:10px;text-align:center;color:var(--muted);padding:6px 0 2px}
.sheet{position:fixed;z-index:60;left:0;right:0;bottom:0;max-height:85dvh;background:color-mix(in oklab,var(--panel) 97%,black 3%);border-top-left-radius:30px;border-top-right-radius:30px;border:1px solid var(--line);box-shadow:var(--shadow);padding:10px 16px max(18px,env(safe-area-inset-bottom));transform:translateY(103%);transition:transform .42s var(--spring);display:flex;flex-direction:column;gap:12px}
.sheet.open{transform:translateY(0)}
.handle{width:42px;height:5px;border-radius:999px;background:var(--line);margin:0 auto 4px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-head h2{margin:0;font-size:22px;letter-spacing:-.7px}
.sheet-body{overflow:auto;display:grid;gap:10px;padding-bottom:4px}
.helper{font-size:13px;color:var(--muted);line-height:1.55;margin:0}
.option,.list-btn,.theme-card,.seg-btn,.tile-btn{background:var(--panel);border:1px solid var(--line);border-radius:20px;color:var(--text)}
.option{display:flex;align-items:center;gap:12px;padding:14px 14px;text-align:left}
.option:hover,.list-btn:hover,.theme-card:hover,.seg-btn:hover,.tile-btn:hover{background:var(--hover)}
.option .meta,.list-btn .meta{display:flex;flex-direction:column;gap:3px;align-items:flex-start;min-width:0}
.option b,.list-btn b{font-size:15px;letter-spacing:-.2px}
.option small,.list-btn small{font-size:12px;color:var(--muted)}
.option .rightcheck{margin-left:auto;color:var(--accent)}
.segment{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg-btn{padding:12px 10px;display:grid;gap:4px;text-align:left}
.seg-btn.active{border-color:color-mix(in oklab,var(--accent),transparent 30%);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--accent),transparent 45%);background:rgba(217,119,87,.10)}
.seg-btn strong{font-size:14px}.seg-btn small{font-size:11px;color:var(--muted)}
.field{display:grid;gap:6px}.field label{font-size:13px;color:var(--muted)}
.field input,.field textarea{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:12px 14px;outline:none}
.field input:focus,.field textarea:focus{border-color:color-mix(in oklab,var(--accent),var(--line) 45%)}
.settings-grid{display:grid;gap:12px}
.settings-card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:14px}
.settings-card h3{margin:0 0 10px;font-size:15px;letter-spacing:-.2px}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.theme-card{padding:10px;border-radius:20px;text-align:center;display:grid;gap:10px}
.theme-card.active{border-color:#6e89ff;box-shadow:inset 0 0 0 1px #6e89ff}
.theme-preview{height:92px;border-radius:14px;border:1px solid var(--line);overflow:hidden;position:relative;background:#fff}
.theme-preview.dark{background:#171717}.theme-preview.system{background:linear-gradient(135deg,#fff 0 50%,#171717 50% 100%)}
.theme-preview::before,.theme-preview::after{content:"";position:absolute;left:10px;right:10px;border-radius:999px;background:rgba(0,0,0,.18)}
.theme-preview::before{top:10px;height:5px;width:34px}.theme-preview::after{top:22px;height:4px;width:52px}.theme-preview i{position:absolute;right:10px;bottom:10px;width:16px;height:16px;border-radius:50%;background:var(--accent)}
.toggle-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.toggle-row:first-of-type{border-top:0;padding-top:0}.toggle-meta b{display:block}.toggle-meta small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.switch{width:50px;height:30px;border-radius:999px;background:#5a5a58;position:relative;flex:none;transition:background .22s ease}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s var(--spring)}
.switch.on{background:#2f78e6}.switch.on i{transform:translateX(20px)}
.preview-modal{z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}
.preview-card{max-width:min(92vw,820px);max-height:88dvh;background:var(--panel);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:var(--shadow);animation:pop .35s var(--spring)}
.preview-card img{display:block;max-width:100%;max-height:calc(88dvh - 68px);background:#0f0f10}
.preview-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:rgba(20,20,20,.88);color:#fff;padding:11px 14px;border-radius:16px;border:1px solid rgba(255,255,255,.08);font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .24s var(--spring);z-index:100;max-width:min(92vw,420px);text-align:center;backdrop-filter:blur(10px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.scroll-fab{position:fixed;right:16px;bottom:170px;width:42px;height:42px;border-radius:50%;background:var(--panel);border:1px solid var(--line);color:var(--muted);display:grid;place-items:center;box-shadow:var(--shadow);opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .22s ease, transform .28s var(--spring);z-index:30}.scroll-fab.show{opacity:1;pointer-events:auto;transform:translateY(0)}
.empty-note{padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:22px;color:var(--muted);box-shadow:var(--shadow)}
.library{display:grid;gap:14px;padding:8px 0 20px}.library h2{margin:0 0 4px;font-size:24px;letter-spacing:-.8px}.library-grid{display:grid;gap:16px}
