name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK components
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK unavailable}}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$MANAGER" ]; then
            MANAGER="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)"
          fi
          test -x "$MANAGER"
          (set +o pipefail; yes | "$MANAGER" --sdk_root="$SDK" --licenses)
          "$MANAGER" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Check embedded UI syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("app/src/main/assets/index.html").read_text()
          Path("/tmp/solune.js").write_text(s.split("<script>",1)[1].rsplit("</script>",1)[0])
          PY
          node --check /tmp/solune.js
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK signature and architecture
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$SDK/build-tools/35.0.0/apksigner" verify "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libsolune.so'
      - uses: actions/upload-artifact@v4
        with:
          name: SoluneAI-2.6-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish SoluneAI APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          test -n "$VERSION"
          APK="SoluneAI-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          TAG="v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "SoluneAI $VERSION" --notes "Android ARM64 debug-signed APK. Continuous answers, follow scrolling, buffered generation, shared 24-hour quotas and Code Studio."
          fi
          gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          gh release view "$TAG" --json url,assets
